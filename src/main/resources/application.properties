spring.application.name=gameflix-user-service
# Optional untracked file in the project root holding DB credentials / JWT secret (see application.properties.example)
spring.config.import=optional:file:./application-local.properties

# --- MySQL (no defaults for credentials: startup fails fast if they are missing) ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/gameflix}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# update: creates/alters the table but keeps data between runs (create-drop would wipe test evidence)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# --- JWT ---
gameflix.jwt.secret=${JWT_SECRET}
gameflix.jwt.issuer=gameflix-user-service
gameflix.jwt.expiration-minutes=30

# --- CORS: exactly one front-end origin ---
gameflix.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:3000}
